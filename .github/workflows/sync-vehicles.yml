name: Sync vehicles

on:
  schedule:
    - cron: '15 2 1 * *' # 1-е число месяца, 05:15 МСК
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate pipeline
        run: python -m unittest discover -s tests

      - name: Refresh vehicle catalog
        run: python scripts/update.py vehicles

      - name: Refresh icon sprite
        continue-on-error: true
        run: python scripts/update.py icons

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vehicles.json assets/icons.svg
          if git diff --staged --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "Refresh vehicle catalog"
          git push
