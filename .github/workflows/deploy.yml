name: Deploy Pages

on:
  # pushes от github-actions[bot] не запускают другие workflow, поэтому деплой
  # слушает завершение контуров обновления через workflow_run
  workflow_run:
    workflows: ["Sync marks", "Sync vehicles"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Tailwind CLI
        uses: actions/cache@v4
        with:
          path: .cache/tailwind
          key: tailwind-v3.4.17-${{ runner.os }}

      - name: Build CSS
        run: python scripts/build_css.py

      - name: Build site artifact
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/latest.json _site/data/
          if [ -f data/meta.json ]; then cp data/meta.json _site/data/; fi
          cp -r data/history _site/data/
          if [ -d assets ]; then cp -r assets _site/; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
