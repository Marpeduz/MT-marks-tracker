name: Update Tank Marks

on:
  schedule:
    - cron: '30 1,9 * * *' # Запуск в 04:30 и 12:00 по МСК (UTC+3)
  workflow_dispatch:      # Кнопка ручного запуска на вкладке Actions

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run parser script
        run: |
          python scripts/update.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Auto-update tank marks data" && git push)
