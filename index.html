<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B0B10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TANK MARKS • Мир Танков</title>
    
    <!-- Фавикон во вкладке браузера (Танковый прицел) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230B0B10' stroke='%238B5CF6' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23C084FC' stroke-width='1.5' stroke-dasharray='3 2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23C084FC'/%3E%3Cpath d='M16 2v6M16 24v6M2 16h6M24 16h6' stroke='%238B5CF6' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">

    <!-- Шрифты Inter и JetBrains Mono для идеального выравнивания цифр -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Собранный Tailwind CSS -->
    <link rel="stylesheet" href="assets/app.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-neonViolet selection:text-white antialiased">

    <!-- Шапка -->
    <header class="sticky top-0 z-40 backdrop-blur-md bg-obsidian/90 border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
            <div class="flex items-center justify-between w-full md:w-auto">
                <div class="flex items-center gap-3">
                    <!-- Логотип сайта -->
                    <div class="w-10 h-10 rounded-xl bg-neonViolet/15 border border-neonViolet/30 flex items-center justify-center shadow-lg shadow-neonViolet/20 shrink-0">
                        <svg class="w-6 h-6 text-neonGlow" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="9" stroke-width="1.8" class="text-neonViolet" />
                            <circle cx="12" cy="12" r="4.5" stroke-width="1.4" stroke-dasharray="2 2" />
                            <circle cx="12" cy="12" r="1.5" fill="currentColor" />
                            <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke-width="1.8" stroke-linecap="round" class="text-neonViolet" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="font-bold text-base tracking-wide text-white flex items-center gap-2">
                            TANK<span class="text-neonViolet">MARKS</span> 
                            <span class="text-[11px] px-2 py-0.5 rounded-full bg-neonViolet/20 text-neonGlow border border-neonViolet/30">Lesta RU</span>
                        </h1>
                        <p class="text-[11px] text-slate-400" id="lastUpdated">Загрузка данных...</p>
                    </div>
                </div>
            </div>

            <!-- Строка поиска с кнопкой очистки -->
            <div class="w-full md:w-80 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="searchInput" placeholder="Поиск по названию..." 
                    class="w-full pl-9 pr-8 py-2 bg-slateCard border border-white/10 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-neonViolet focus:ring-1 focus:ring-neonViolet/50 transition-all">
                <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-white transition-colors">
                    ✕
                </button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-7xl mx-auto px-4 py-5 flex-grow w-full">
        
        <!-- Панель фильтров -->
        <div class="bg-slateCard border border-white/5 rounded-2xl p-4 mb-5 shadow-xl space-y-4">
            <!-- Уровни техники (мультиселект) -->
            <div>
                <div class="flex items-baseline justify-between gap-3 mb-1.5">
                    <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Уровень техники</span>
                    <span class="text-[10px] text-slate-500">можно выбрать несколько</span>
                </div>
                <div class="flex flex-wrap gap-1.5" id="tierFilters">
                    <button data-tier="all" class="tier-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">Все</button>
                    <button data-tier="5" class="tier-btn px-3 py-1.5 rounded-lg text-xs font-medium font-mono transition-all">V</button>
                    <button data-tier="6" class="tier-btn px-3 py-1.5 rounded-lg text-xs font-medium font-mono transition-all">VI</button>
                    <button data-tier="7" class="tier-btn px-3 py-1.5 rounded-lg text-xs font-medium font-mono transition-all">VII</button>
                    <button data-tier="8" class="tier-btn px-3 py-1.5 rounded-lg text-xs font-medium font-mono transition-all">VIII</button>
                    <button data-tier="9" class="tier-btn px-3 py-1.5 rounded-lg text-xs font-medium font-mono transition-all">IX</button>
                    <button data-tier="10" class="tier-btn px-3 py-1.5 rounded-lg text-xs font-medium font-mono transition-all">X</button>
                    <button data-tier="11" class="tier-btn px-3 py-1.5 rounded-lg text-xs font-medium font-mono transition-all">XI</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                <!-- Классы техники -->
                <div>
                    <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1.5">Класс техники</span>
                    <div class="flex flex-wrap gap-1.5" id="classFilters">
                        <button data-class="all" class="class-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">Все</button>
                        <button data-class="heavyTank" class="class-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">ТТ</button>
                        <button data-class="mediumTank" class="class-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">СТ</button>
                        <button data-class="lightTank" class="class-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">ЛТ</button>
                        <button data-class="AT-SPG" class="class-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">ПТ</button>
                        <button data-class="SPG" class="class-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">САУ</button>
                    </div>
                </div>

                <!-- Тип получения -->
                <div>
                    <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1.5">Тип получения</span>
                    <div class="flex flex-wrap gap-1.5" id="typeFilters">
                        <button data-type="all" class="type-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">Все</button>
                        <button data-type="tech" class="type-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">Прокачиваемые</button>
                        <button data-type="prem" class="type-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">Премиум / Акционные</button>
                    </div>
                </div>

                <!-- Нация -->
                <div class="relative" id="nationDropdown">
                    <span id="nationFilterTitle" class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1.5">Нация</span>
                    <button type="button" id="nationFilterBtn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="nationFilterTitle"
                        class="w-full flex items-center justify-between gap-2 px-3 py-2 bg-black/25 border border-white/10 rounded-lg text-xs text-slate-200 hover:border-white/20 focus:outline-none focus:border-neonViolet focus:ring-1 focus:ring-neonViolet/40 transition-colors cursor-pointer">
                        <span id="nationFilterLabel">Все нации</span>
                        <svg id="nationFilterChevron" class="w-3.5 h-3.5 shrink-0 text-slate-400 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div id="nationFilterMenu" role="listbox" aria-labelledby="nationFilterTitle"
                        class="hidden absolute z-50 left-0 right-0 mt-1.5 max-h-64 overflow-y-auto custom-scrollbar bg-slateCard border border-white/10 rounded-xl shadow-2xl shadow-black/50 p-1">
                    </div>
                </div>
            </div>

            <!-- Индикатор количества и быстрый сброс -->
            <div class="pt-2.5 border-t border-white/5 flex items-center justify-between gap-3 text-xs text-slate-400">
                <span id="resultsCounter">Загрузка списка...</span>
                <button id="resetFiltersBtn" onclick="resetAllFilters()" class="hidden text-neonGlow hover:text-white font-medium flex items-center gap-1 transition-colors shrink-0">
                    <span>✕ Сбросить фильтры</span>
                </button>
            </div>
        </div>

        <!-- Десктопная таблица (скрыта на узких экранах < 640px) -->
        <div class="hidden sm:block bg-slateCard border border-white/5 rounded-2xl shadow-2xl overflow-clip">
            <table class="w-full text-left border-collapse">
                <thead class="sticky top-[65px] z-30 bg-[#12111C]/95 backdrop-blur-md border-b border-white/10 text-xs font-semibold text-slate-400 uppercase">
                    <tr>
                        <th class="py-3.5 px-4 cursor-pointer hover:text-white transition-colors select-none" onclick="sortTable('name')">
                            Танк <span id="sort-name" class="text-slate-600 ml-0.5">↕</span>
                        </th>
                        <th class="py-3.5 px-3 text-center cursor-pointer hover:text-white transition-colors select-none" onclick="sortTable('tier')">
                            Ур. <span id="sort-tier" class="text-slate-600 ml-0.5">↕</span>
                        </th>
                        <th class="py-3.5 px-3 text-center cursor-pointer hover:text-white transition-colors select-none" onclick="sortTable('m65')">
                            65% <span id="sort-m65" class="text-slate-600 ml-0.5">↕</span>
                        </th>
                        <th class="py-3.5 px-3 text-center cursor-pointer hover:text-white transition-colors select-none" onclick="sortTable('m85')">
                            85% <span id="sort-m85" class="text-slate-600 ml-0.5">↕</span>
                        </th>
                        <th class="py-3.5 px-3 text-center cursor-pointer hover:text-white transition-colors select-none text-neonGlow" onclick="sortTable('m95')">
                            95% <span id="sort-m95" class="text-slate-600 ml-0.5">↕</span>
                        </th>
                        <th class="py-3.5 px-3 text-center cursor-pointer hover:text-white transition-colors select-none text-cyan-400" onclick="sortTable('m100')">
                            100% <span id="sort-m100" class="text-slate-600 ml-0.5">↕</span>
                        </th>
                        <th class="py-3.5 px-3 text-center">График</th>
                    </tr>
                </thead>
                <tbody id="tankTableBody" class="divide-y divide-white/5 text-sm">
                    <!-- Скелетон при загрузке -->
                </tbody>
            </table>
        </div>

        <!-- Мобильные карточки (показываются только на смартфонах < 640px) -->
        <div id="mobileCardsContainer" class="sm:hidden space-y-2.5"></div>
    </main>

    <!-- Модальное окно / Bottom Sheet на смартфонах -->
    <div id="tankModal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/75 backdrop-blur-sm hidden sm:p-4 transition-opacity">
        <div class="bg-slateCard border-t sm:border border-white/10 rounded-t-3xl sm:rounded-2xl max-w-2xl w-full p-5 sm:p-6 shadow-2xl relative max-h-[92vh] overflow-y-auto">
            <!-- Полоска-хэндл для мобильной шторки -->
            <div class="w-12 h-1.5 bg-white/15 rounded-full mx-auto mb-4 sm:hidden"></div>

            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-base font-bold w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center transition-colors">✕</button>
            
            <div class="flex items-center gap-3.5 mb-5">
                <div id="modalClassIcon" class="w-11 h-11 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center shrink-0"></div>
                <div>
                    <div class="flex items-center gap-2">
                        <h2 id="modalTankName" class="text-lg font-bold text-white leading-tight">Название танка</h2>
                        <span id="modalTrendBadge" class="hidden text-[11px] font-mono px-2 py-0.5 rounded-md font-semibold"></span>
                    </div>
                    <p id="modalTankSub" class="text-xs text-slate-400 mt-0.5">Уровень • Класс • Нация</p>
                </div>
            </div>

            <!-- Текущие планки (65% серебро, 85% золото, 95% главный неон, 100% алмазный циан) -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mb-5 font-mono tabular-nums">
                <div class="bg-black/25 p-3 rounded-xl border border-white/5 text-center">
                    <span class="text-[10px] font-sans text-slate-400 block uppercase font-bold tracking-wider">65%</span>
                    <span id="modalM65" class="text-base font-bold text-slate-300 mt-0.5 block">-</span>
                </div>
                <div class="bg-black/25 p-3 rounded-xl border border-white/5 text-center">
                    <span class="text-[10px] font-sans text-amber-500 block uppercase font-bold tracking-wider">85%</span>
                    <span id="modalM85" class="text-base font-bold text-amber-400 mt-0.5 block">-</span>
                </div>
                <div class="bg-neonViolet/15 p-3 rounded-xl border border-neonViolet/40 text-center">
                    <span class="text-[10px] font-sans text-neonGlow block uppercase font-bold tracking-wider">95%</span>
                    <span id="modalM95" class="text-base font-bold text-neonGlow neon-text-shadow mt-0.5 block">-</span>
                </div>
                <div class="bg-black/25 p-3 rounded-xl border border-white/5 text-center">
                    <span class="text-[10px] font-sans text-cyan-500 block uppercase font-bold tracking-wider">100%</span>
                    <span id="modalM100" class="text-base font-bold text-cyan-400 mt-0.5 block">-</span>
                </div>
            </div>

            <!-- Панель управления периодом графика -->
            <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Динамика отметок</span>
                <div class="flex gap-1 bg-black/30 p-1 rounded-xl border border-white/5" id="timeframeButtons">
                    <button data-days="7" onclick="setChartTimeframe(7)" class="tf-btn px-2.5 py-1 rounded-lg text-xs font-medium transition-colors">7д</button>
                    <button data-days="30" onclick="setChartTimeframe(30)" class="tf-btn px-2.5 py-1 rounded-lg text-xs font-medium transition-colors">30д</button>
                    <button data-days="90" onclick="setChartTimeframe(90)" class="tf-btn px-2.5 py-1 rounded-lg text-xs font-medium transition-colors">90д</button>
                    <button data-days="all" onclick="setChartTimeframe('all')" class="tf-btn px-2.5 py-1 rounded-lg text-xs font-medium transition-colors">Все</button>
                </div>
            </div>

            <!-- График динамики -->
            <div class="relative h-64 sm:h-72 w-full pt-1">
                <canvas id="historyChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Футер -->
    <footer class="border-t border-white/10 py-5 mt-10 bg-obsidian">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
            <p>TANK MARKS • Мир Танков (Lesta RU)</p>
        </div>
    </footer>

    <!-- Сюда один раз инъектируется спрайт иконок -->
    <div id="iconsSpriteHost" style="display:none" aria-hidden="true"></div>

    <!-- Скрипты интерфейса -->
    <script>
        let allTanks = [];

        // Уровни — мультиселект. Пустой массив означает «все уровни».
        let currentTiers = [];
        const storedTiers = localStorage.getItem('tm_tiers');
        if (storedTiers) {
            try {
                const parsed = JSON.parse(storedTiers);
                if (Array.isArray(parsed)) currentTiers = parsed.map(String);
            } catch (e) {
                currentTiers = [];
            }
        } else {
            // Миграция со старого одиночного фильтра
            const legacyTier = localStorage.getItem('tm_tier');
            if (legacyTier && legacyTier !== 'all') currentTiers = [String(legacyTier)];
        }

        let currentClass = localStorage.getItem('tm_class') || 'all';
        let currentType = localStorage.getItem('tm_type') || 'all';
        let currentNation = localStorage.getItem('tm_nation') || 'all';

        let currentSort = { field: 'tier', asc: false };
        try {
            const parsedSort = JSON.parse(localStorage.getItem('tm_sort') || 'null');
            if (parsedSort && typeof parsedSort.field === 'string') currentSort = parsedSort;
        } catch (e) {}

        let searchUrlTimer = null;
        
        let activeTankId = null;
        let activeTankHistory = [];
        let currentTimeframe = 'all';
        let chartInstance = null;

        const nationNames = {
            'ussr': 'СССР',
            'germany': 'ГЕРМАНИЯ',
            'usa': 'США',
            'china': 'КИТАЙ',
            'france': 'ФРАНЦИЯ',
            'uk': 'ВЕЛИКОБРИТАНИЯ',
            'japan': 'ЯПОНИЯ',
            'czech': 'ЧЕХИЯ',
            'sweden': 'ШВЕЦИЯ',
            'poland': 'ПОЛЬША',
            'italy': 'ИТАЛИЯ',
            'intunion': 'СБОРНАЯ НАЦИЯ'
        };

        const nationSelectNames = {
            'ussr': 'СССР',
            'germany': 'Германия',
            'usa': 'США',
            'france': 'Франция',
            'uk': 'Великобритания',
            'china': 'Китай',
            'japan': 'Япония',
            'czech': 'Чехия',
            'sweden': 'Швеция',
            'poland': 'Польша',
            'italy': 'Италия',
            'intunion': 'Сборная нация'
        };

        // Подписи боевых ролей Lesta для карточки танка
        const roleLabels = {
            'role_LT_universal': 'Универсал',
            'role_LT_wheeled': 'Колёсный',
            'role_MT_universal': 'Универсал',
            'role_MT_sniper': 'Снайпер',
            'role_MT_support': 'Поддержка',
            'role_MT_assault': 'Штурм',
            'role_HT_universal': 'Универсал',
            'role_HT_break': 'Прорыв',
            'role_HT_assault': 'Штурм',
            'role_HT_support': 'Поддержка',
            'role_ATSPG_universal': 'Универсал',
            'role_ATSPG_sniper': 'Снайпер',
            'role_ATSPG_assault': 'Штурм',
            'role_ATSPG_support': 'Поддержка',
            'role_SPG': 'Классическая',
            'role_SPG_assault': 'Штурмовая',
            'role_SPG_flame': 'Огнемётная'
        };

        const VALID_CLASSES = ['heavyTank', 'mediumTank', 'lightTank', 'AT-SPG', 'SPG'];
        const VALID_TYPES = ['tech', 'prem'];
        const VALID_TIERS = ['5', '6', '7', '8', '9', '10', '11'];
        const VALID_SORT_FIELDS = ['name', 'tier', 'm65', 'm85', 'm95', 'm100'];
        const URL_FILTER_KEYS = ['tier', 'class', 'type', 'nation', 'q', 'sort'];

        function readUrlState(useCurrent = true) {
            const params = new URLSearchParams(location.search);
            if (!URL_FILTER_KEYS.some(key => params.has(key))) return null;

            // При загрузке страницы часть фильтров может прийти из localStorage.
            // При popstate URL — единственный источник истины.
            const baseTiers = useCurrent ? [...currentTiers] : [];
            const baseClass = useCurrent ? currentClass : 'all';
            const baseType = useCurrent ? currentType : 'all';
            const baseNation = useCurrent ? currentNation : 'all';
            const baseQuery = useCurrent ? document.getElementById('searchInput').value : '';
            const baseSort = useCurrent ? { ...currentSort } : { field: 'tier', asc: false };

            const tiersParam = params.get('tier');
            const tiers = tiersParam === null
                ? baseTiers
                : [...new Set(tiersParam.split(',').map(v => v.trim()).filter(v => VALID_TIERS.includes(v)))];

            const nation = params.get('nation');
            const tankClass = params.get('class');
            const type = params.get('type');
            const sortRaw = params.get('sort');
            let sort = baseSort;

            if (sortRaw) {
                const [field, dir] = sortRaw.split('.');
                if (VALID_SORT_FIELDS.includes(field) && (dir === 'asc' || dir === 'desc')) {
                    sort = { field, asc: dir === 'asc' };
                }
            }

            return {
                tiers,
                tankClass: tankClass === null ? baseClass : (VALID_CLASSES.includes(tankClass) ? tankClass : 'all'),
                type: type === null ? baseType : (VALID_TYPES.includes(type) ? type : 'all'),
                nation: nation === null
                    ? baseNation
                    : (Object.prototype.hasOwnProperty.call(nationSelectNames, nation) ? nation : 'all'),
                q: params.has('q') ? params.get('q').slice(0, 100) : baseQuery,
                sort,
            };
        }

        function stateToParams() {
            const params = new URLSearchParams(location.search);
            URL_FILTER_KEYS.forEach(key => params.delete(key));

            if (currentTiers.length) params.set('tier', currentTiers.join(','));
            if (currentClass !== 'all') params.set('class', currentClass);
            if (currentType !== 'all') params.set('type', currentType);
            if (currentNation !== 'all') params.set('nation', currentNation);

            const query = document.getElementById('searchInput').value.trim();
            if (query) params.set('q', query);

            if (currentSort.field !== 'tier' || currentSort.asc !== false) {
                params.set('sort', `${currentSort.field}.${currentSort.asc ? 'asc' : 'desc'}`);
            }
            return params;
        }

        function updateUrl(mode = 'replace') {
            const query = stateToParams().toString();
            const url = location.pathname + (query ? '?' + query : '') + location.hash;
            if (mode === 'push') {
                history.pushState({}, '', url);
            } else {
                history.replaceState({}, '', url);
            }
        }

        function persistState() {
            localStorage.setItem('tm_tiers', JSON.stringify(currentTiers));
            localStorage.removeItem('tm_tier');
            localStorage.removeItem('tm_role');
            localStorage.setItem('tm_class', currentClass);
            localStorage.setItem('tm_type', currentType);
            localStorage.setItem('tm_nation', currentNation);
            localStorage.setItem('tm_sort', JSON.stringify(currentSort));
        }

        function applyFiltersChange(mode = 'push') {
            persistState();
            updateUrl(mode);
            syncFilterButtonsUI();
            renderTable();
        }

        function applyUrlState() {
            clearTimeout(searchUrlTimer);
            const state = readUrlState(false);

            if (state) {
                currentTiers = state.tiers;
                currentClass = state.tankClass;
                currentType = state.type;
                currentNation = state.nation;
                currentSort = state.sort;
                document.getElementById('searchInput').value = state.q;
            } else {
                currentTiers = [];
                currentClass = 'all';
                currentType = 'all';
                currentNation = 'all';
                currentSort = { field: 'tier', asc: false };
                document.getElementById('searchInput').value = '';
            }

            persistState();
            syncFilterButtonsUI();
            renderTable();
        }

        function initUrlState() {
            const state = readUrlState();
            if (state) {
                currentTiers = state.tiers;
                currentClass = state.tankClass;
                currentType = state.type;
                currentNation = state.nation;
                currentSort = state.sort;
                document.getElementById('searchInput').value = state.q;
            }
            updateUrl('replace');
            window.addEventListener('popstate', applyUrlState);
        }

        // Раскладки: физические клавиши QWERTY <-> ЙЦУКЕН
        const LAYOUT_EN = "`qwertyuiop[]asdfghjkl;'zxcvbnm,./";
        const LAYOUT_RU = "ёйцукенгшщзхъфывапролджэячсмитьбю.,";

        const TRANSLIT_MAP = {
            'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'е': 'e',
            'ж': 'zh', 'з': 'z', 'и': 'i', 'й': 'y', 'к': 'k', 'л': 'l',
            'м': 'm', 'н': 'n', 'о': 'o', 'п': 'p', 'р': 'r', 'с': 's',
            'т': 't', 'у': 'u', 'ф': 'f', 'х': 'h', 'ц': 'c', 'ч': 'ch',
            'ш': 'sh', 'щ': 'sch', 'ъ': '', 'ы': 'y', 'ь': '', 'э': 'e',
            'ю': 'yu', 'я': 'ya'
        };

        const REVERSE_TRANSLIT = [
            ['sch', 'щ'], ['sh', 'ш'], ['ch', 'ч'], ['zh', 'ж'],
            ['yu', 'ю'], ['ya', 'я'], ['kh', 'х'], ['ts', 'ц'],
            ['a', 'а'], ['b', 'б'], ['v', 'в'], ['g', 'г'], ['d', 'д'],
            ['e', 'е'], ['z', 'з'], ['i', 'и'], ['y', 'й'], ['k', 'к'],
            ['l', 'л'], ['m', 'м'], ['n', 'н'], ['o', 'о'], ['p', 'п'],
            ['r', 'р'], ['s', 'с'], ['t', 'т'], ['u', 'у'], ['f', 'ф'],
            ['h', 'х'], ['c', 'ц'], ['j', 'й'], ['w', 'в'], ['x', 'кс']
        ];

        // Народные названия техники. Ключ — что вводит игрок, значение — фрагмент
        // названия/тега в базе. Новые алиасы добавлять сюда; нормализация и
        // транслитерация применяются автоматически.
        const SLANG_MAP = {
            // Британцы
            'конь': ['super conqueror'],
            'конек': ['super conqueror'],
            'конька': ['super conqueror'],
            'бабаха': ['fv4005'],
            'бабка': ['fv4005'],
            'гриль': ['grille'],
            'грилка': ['grille'],
            'гриля': ['grille'],
            'бурасик': ['bourrasque'],
            'бура': ['bourrasque'],
            'ебр': ['ebr'],
            'ебэр': ['ebr'],
            'эбр': ['ebr'],
            'лео': ['leopard'],
            'леопард': ['leopard'],
            'чиф': ['chieftain'],
            'чифтан': ['chieftain'],
            'чафти': ['chieftain'],
            'мантикора': ['manticore'],
            'манти': ['manticore'],
            'цент': ['centurion'],
            'центурион': ['centurion'],

            // СССР
            'огурец': ['279'],
            'огур': ['279'],
            'дед': ['ис-7'],
            'дедушка': ['ис-7'],
            'ися': ['ис-', 'is-'],
            'иски': ['ис-'],
            'объект': ['объект'],

            // Германия
            'мышь': ['maus'],
            'мышка': ['maus'],
            'крыса': ['maus'],
            'тигр': ['tiger'],
            'тигра': ['tiger'],
            'королева': ['tiger ii'],
            'король': ['tiger ii'],
            'пантера': ['panther'],
            'пантер': ['panther'],
            'фердинанд': ['ferdinand'],
            'ферди': ['ferdinand'],
            'нашорн': ['nashorn'],
            'носорог': ['nashorn'],
            'яга': ['jagdpanzer'],
            'ягд': ['jagdpanzer'],
            'ягдтигр': ['jagdtiger'],

            // США, Италия, Польша, Китай
            'шерман': ['sherman'],
            'першинг': ['pershing'],
            'паттон': ['patton'],
            'калибан': ['caliban'],
            'прога': ['progetto'],
            'рога': ['progetto'],
            'вазик': ['wz-'],
            'вазя': ['wz-']
        };

        let searchIndex = [];
        let searchById = new Map();

        function normalizeText(value) {
            let text = String(value ?? '').toLowerCase();
            text = text.replace(/ё/g, 'е');
            text = text.replace(/[’‘`]/g, "'").replace(/[–—−]/g, '-');
            text = text.replace(/[^a-z0-9а-я'\-. ]/gi, ' ');
            return text.replace(/\s+/g, ' ').trim();
        }

        function compactText(text) {
            return String(text ?? '').replace(/[^a-z0-9а-я]/gi, '');
        }

        function convertLayout(text, from, to) {
            let result = '';
            for (const char of text) {
                const index = from.indexOf(char);
                result += index === -1 ? char : to[index];
            }
            return result;
        }

        function transliterate(text) {
            return [...text].map(char => TRANSLIT_MAP[char] ?? char).join('');
        }

        function reverseTransliterate(text) {
            let result = '';
            let index = 0;
            while (index < text.length) {
                let matched = false;
                for (const [latin, cyrillic] of REVERSE_TRANSLIT) {
                    if (text.startsWith(latin, index)) {
                        result += cyrillic;
                        index += latin.length;
                        matched = true;
                        break;
                    }
                }
                if (!matched) {
                    result += text[index];
                    index += 1;
                }
            }
            return result;
        }

        const SLANG_INDEX = Object.fromEntries(
            Object.entries(SLANG_MAP).map(([alias, targets]) => [normalizeText(alias), targets])
        );

        function buildSearchEntry(tank) {
            const base = [tank.name, tank.short_name, tank.tag].filter(Boolean).map(normalizeText);
            const strings = new Set();

            const add = (value) => {
                if (!value) return;
                strings.add(value);
                const compact = compactText(value);
                if (compact) strings.add(compact);
            };

            base.forEach(add);
            base.forEach(value => {
                add(transliterate(value));
                add(reverseTransliterate(value));
                add(convertLayout(value, LAYOUT_RU, LAYOUT_EN));
                add(convertLayout(value, LAYOUT_EN, LAYOUT_RU));
            });

            return { tank, id: String(tank.id ?? ''), strings: [...strings] };
        }

        function buildSearchIndex() {
            searchIndex = allTanks.map(buildSearchEntry);
            searchById = new Map(searchIndex.map(entry => [entry.tank.id, entry]));
        }

        function buildQueryVariants(raw) {
            const base = normalizeText(raw);
            if (!base) return [];

            const variants = new Set();
            const push = (value, keep) => {
                if (!value) return;
                if (keep(value)) variants.add(value);
                const compact = compactText(value);
                if (compact && keep(compact)) variants.add(compact);
            };
            const add = value => push(value, () => true);
            // Короткие варианты вроде "kon" от "конь" или "is" от "ис-" дают ложные совпадения
            const addDerived = value => push(value, v => v.length >= 4 || /\d/.test(v));
            const addSlang = value => push(value, v => v.length >= 3 || /\d/.test(v));

            add(base);
            const targets = SLANG_INDEX[base] || [];
            targets.forEach(target => {
                const normalized = normalizeText(target);
                addSlang(normalized);
                addDerived(transliterate(normalized));
                addDerived(reverseTransliterate(normalized));
                addDerived(convertLayout(normalized, LAYOUT_EN, LAYOUT_RU));
                addDerived(convertLayout(normalized, LAYOUT_RU, LAYOUT_EN));
            });

            addDerived(transliterate(base));
            addDerived(reverseTransliterate(base));
            addDerived(convertLayout(base, LAYOUT_EN, LAYOUT_RU));
            addDerived(convertLayout(base, LAYOUT_RU, LAYOUT_EN));

            return [...variants].filter(Boolean).sort((a, b) => b.length - a.length);
        }

        function matchesSearch(entry, variants) {
            // id требует точного совпадения, чтобы "279" не находил танк с id 27905
            if (entry.id && variants.includes(entry.id)) return true;
            return variants.some(variant => entry.strings.some(value => value.includes(variant)));
        }

        // Иконки танков берутся из одного локального спрайта (один запрос вместо 787)
        function iconSymbolId(tag) {
            return 'i_' + String(tag || '').replace(/[^A-Za-z0-9_-]/g, '_');
        }

        function getTankIconSvg(tag) {
            if (!tag) return '';
            return `<svg class="w-14 h-8 shrink-0 opacity-85 group-hover:opacity-100 transition-opacity pointer-events-none" aria-hidden="true"><use href="#${iconSymbolId(tag)}" width="56" height="32"></use></svg>`;
        }

        // Один запрос на все иконки; после инъекции существующие <use> разрешаются сами
        async function loadIconsSprite() {
            try {
                const response = await fetch('assets/icons.svg', { cache: 'no-cache' });
                if (!response.ok) return;
                document.getElementById('iconsSpriteHost').innerHTML = await response.text();
            } catch (e) {
                console.warn('Не удалось загрузить спрайт иконок', e);
            }
        }

        // Векторные иконки классов из клиента игры (белый для прокачиваемых, золотой для премов)
        function getClassSvg(type, isPremium = false) {
            const color = isPremium ? '#F59E0B' : '#FFFFFF';
            switch(type) {
                case 'heavyTank':
                    return `<svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="${color}">
                        <g transform="rotate(-45 12 12)">
                            <rect x="3.5" y="3.5" width="4.5" height="17"/>
                            <rect x="9.75" y="3.5" width="4.5" height="17"/>
                            <rect x="16" y="3.5" width="4.5" height="17"/>
                        </g>
                    </svg>`;
                case 'mediumTank':
                    return `<svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="${color}">
                        <g transform="rotate(-45 12 12)">
                            <rect x="3.5" y="3.5" width="7" height="17"/>
                            <rect x="13.5" y="3.5" width="7" height="17"/>
                        </g>
                    </svg>`;
                case 'lightTank':
                    return `<svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="${color}">
                        <rect x="4.5" y="4.5" width="15" height="15" transform="rotate(45 12 12)"/>
                    </svg>`;
                case 'AT-SPG':
                    return `<svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="${color}">
                        <polygon points="3,5 21,5 12,20"/>
                    </svg>`;
                case 'SPG':
                    return `<svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="${color}">
                        <rect x="4.5" y="4.5" width="15" height="15"/>
                    </svg>`;
                default:
                    return `<svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="${color}"><circle cx="12" cy="12" r="7"/></svg>`;
            }
        }

        // Экранирование данных из внешнего API перед вставкой в innerHTML
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        // Форматирование чисел с пробелом тысячи (4 850)
        function formatNum(num) {
            if (!num) return '-';
            return Number(num).toLocaleString('ru-RU');
        }

        // Отрисовка Skeleton-загрузки
        function showSkeleton() {
            const tbody = document.getElementById('tankTableBody');
            const skeletonRows = Array(8).fill(0).map(() => `
                <tr class="animate-pulse">
                    <td class="py-3.5 px-4"><div class="h-5 bg-white/5 rounded-lg w-48"></div></td>
                    <td class="py-3.5 px-3"><div class="h-5 bg-white/5 rounded-lg w-8 mx-auto"></div></td>
                    <td class="py-3.5 px-3"><div class="h-5 bg-white/5 rounded-lg w-16 mx-auto"></div></td>
                    <td class="py-3.5 px-3"><div class="h-5 bg-white/5 rounded-lg w-16 mx-auto"></div></td>
                    <td class="py-3.5 px-3"><div class="h-5 bg-white/5 rounded-lg w-16 mx-auto"></div></td>
                    <td class="py-3.5 px-3"><div class="h-5 bg-white/5 rounded-lg w-16 mx-auto"></div></td>
                    <td class="py-3.5 px-3"><div class="h-6 bg-white/5 rounded-lg w-20 mx-auto"></div></td>
                </tr>
            `).join('');
            tbody.innerHTML = skeletonRows;
        }

        function setNationMenuOpen(open) {
            const menu = document.getElementById('nationFilterMenu');
            const btn = document.getElementById('nationFilterBtn');
            const chevron = document.getElementById('nationFilterChevron');
            if (!menu || !btn) return;
            menu.classList.toggle('hidden', !open);
            btn.setAttribute('aria-expanded', String(open));
            if (chevron) chevron.classList.toggle('rotate-180', open);
        }

        // Кастомный dropdown нации в палитре сайта
        function syncNationDropdown() {
            const label = document.getElementById('nationFilterLabel');
            if (label) label.textContent = currentNation === 'all' ? 'Все нации' : (nationSelectNames[currentNation] || 'Все нации');

            const menu = document.getElementById('nationFilterMenu');
            if (!menu) return;

            const presentNations = new Set(allTanks.map(t => t.nation).filter(Boolean));
            const options = [['all', 'Все нации']].concat(
                Object.keys(nationSelectNames)
                    .filter(code => presentNations.has(code))
                    .map(code => [code, nationSelectNames[code]])
            );

            menu.innerHTML = options.map(([code, name]) => {
                const active = code === currentNation;
                return `<button type="button" role="option" aria-selected="${active}" data-nation="${code}" class="w-full flex items-center justify-between gap-2 px-2.5 py-2 rounded-lg text-xs text-left transition-colors ${active ? 'bg-neonViolet/20 text-neonGlow' : 'text-slate-300 hover:bg-white/5 hover:text-white'}">
                    <span>${name}</span>
                    <svg class="w-3.5 h-3.5 shrink-0 ${active ? '' : 'invisible'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                </button>`;
            }).join('');
        }

        // Подсветка активных кнопок фильтров
        function syncFilterButtonsUI() {
            const activeClasses = ['bg-neonViolet', 'text-white', 'shadow-sm', 'shadow-neonViolet/40', 'border', 'border-neonViolet/50'];
            const inactiveClasses = ['bg-white/5', 'text-slate-300', 'hover:bg-white/10', 'border', 'border-transparent'];
            const elevenIdleClasses = ['text-amber-300', 'ring-1', 'ring-amber-400/30'];

            document.querySelectorAll('.tier-btn').forEach(btn => {
                const tier = btn.dataset.tier;
                const isActive = tier === 'all' ? currentTiers.length === 0 : currentTiers.includes(tier);
                btn.classList.remove(...activeClasses, ...inactiveClasses, ...elevenIdleClasses);
                if (isActive) {
                    btn.classList.add(...activeClasses);
                } else {
                    btn.classList.add(...inactiveClasses);
                    if (tier === '11') btn.classList.add(...elevenIdleClasses);
                }
            });

            document.querySelectorAll('.class-btn').forEach(btn => {
                btn.classList.remove(...activeClasses, ...inactiveClasses);
                btn.classList.add(...(btn.dataset.class === currentClass ? activeClasses : inactiveClasses));
            });

            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.remove(...activeClasses, ...inactiveClasses);
                btn.classList.add(...(btn.dataset.type === currentType ? activeClasses : inactiveClasses));
            });

            // Синхронизация кастомного dropdown нации
            syncNationDropdown();

            // Стрелки сортировки в шапке таблицы
            ['name', 'tier', 'm65', 'm85', 'm95', 'm100'].forEach(field => {
                const el = document.getElementById(`sort-${field}`);
                if (!el) return;
                if (currentSort.field === field) {
                    el.innerText = currentSort.asc ? '↑' : '↓';
                    el.className = 'text-white ml-0.5 font-bold';
                } else {
                    el.innerText = '↕';
                    el.className = 'text-slate-600 ml-0.5';
                }
            });
        }

        // Заполнение фильтров только теми значениями, которые есть в данных
        function populateFilterOptions() {
            const presentNations = new Set(allTanks.map(t => t.nation).filter(Boolean));

            // Сбрасываем сохранённое значение, если такой нации больше нет
            if (currentNation !== 'all' && !presentNations.has(currentNation)) currentNation = 'all';

            syncFilterButtonsUI();
        }

        // Загрузка данных
        async function loadData() {
            showSkeleton();
            syncFilterButtonsUI();
            try {
                const response = await fetch('./data/latest.json', { cache: 'no-cache' });
                if (!response.ok) throw new Error('Файл latest.json не найден');
                const data = await response.json();
                
                allTanks = data.vehicles || [];
                buildSearchIndex();
                populateFilterOptions();
                updateUrl('replace');
                
                if (data.updated_at) {
                    const date = new Date(data.updated_at);
                    document.getElementById('lastUpdated').innerText = `Обновлено: ${date.toLocaleDateString('ru-RU')} в ${date.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'})}`;
                }

                renderTable();
            } catch (err) {
                console.error(err);
                document.getElementById('tankTableBody').innerHTML = `<tr><td colspan="7" class="py-8 text-center text-red-400">Не удалось загрузить базу отметок.</td></tr>`;
            }
        }

        // Отрисовка таблицы и мобильных карточек
        function renderTable() {
            const tbody = document.getElementById('tankTableBody');
            const mobileContainer = document.getElementById('mobileCardsContainer');
            const searchInput = document.getElementById('searchInput');
            const searchVal = searchInput.value.toLowerCase().trim();
            
            // Показываем/скрываем крестик очистки поиска
            document.getElementById('clearSearchBtn').classList.toggle('hidden', !searchVal);

            // Показываем/скрываем кнопку сброса всех фильтров
            const isDefaultFilters = currentTiers.length === 0 && currentClass === 'all' && currentType === 'all' &&
                currentNation === 'all' && !searchVal;
            document.getElementById('resetFiltersBtn').classList.toggle('hidden', isDefaultFilters);

            const queryVariants = buildQueryVariants(searchVal);

            const filtered = allTanks.filter(t => {
                if (currentTiers.length > 0 && !currentTiers.includes(String(t.tier))) return false;
                if (currentClass !== 'all' && t.type !== currentClass) return false;
                if (currentNation !== 'all' && t.nation !== currentNation) return false;
                
                const isPremOrSpecial = Boolean(t.is_premium || t.is_special);
                if (currentType === 'tech' && isPremOrSpecial) return false;
                if (currentType === 'prem' && !isPremOrSpecial) return false;

                if (queryVariants.length) {
                    const entry = searchById.get(t.id);
                    if (!entry || !matchesSearch(entry, queryVariants)) return false;
                }
                return true;
            });

            // Обновляем счетчик найденных танков
            document.getElementById('resultsCounter').innerText = `Найдено техники: ${filtered.length} из ${allTanks.length}`;

            // Сортировка
            filtered.sort((a, b) => {
                let valA, valB;
                if (currentSort.field === 'name') {
                    valA = a.name || '';
                    valB = b.name || '';
                    return currentSort.asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else if (currentSort.field === 'tier') {
                    valA = a.tier || 0;
                    valB = b.tier || 0;
                } else {
                    valA = (a.marks && a.marks[currentSort.field.replace('m', '')]) || 0;
                    valB = (b.marks && b.marks[currentSort.field.replace('m', '')]) || 0;
                }
                return currentSort.asc ? valA - valB : valB - valA;
            });

            if (filtered.length === 0) {
                const emptyHtml = `
                    <div class="py-10 text-center text-slate-400">
                        <p class="mb-2">Техника по заданным фильтрам не найдена</p>
                        <button onclick="resetAllFilters()" class="px-3 py-1.5 rounded-lg bg-neonViolet/20 text-neonGlow hover:bg-neonViolet hover:text-white text-xs font-medium transition-colors">Сбросить параметры</button>
                    </div>`;
                tbody.innerHTML = `<tr><td colspan="7">${emptyHtml}</td></tr>`;
                mobileContainer.innerHTML = emptyHtml;
                return;
            }

            const romanTiers = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];

            // Десктопные строки (65% серебро, 85% золото, 95% главный неон, 100% циан)
            tbody.innerHTML = filtered.map(t => {
                const m = t.marks || {};
                const tierDisplay = romanTiers[t.tier] || t.tier;
                const isPrem = Boolean(t.is_premium || t.is_special);
                const nationLabel = nationNames[t.nation] || (t.nation ? t.nation.toUpperCase() : '');

                return `
                    <tr onclick="openTankModal(${t.id})" class="hover:bg-white/[0.04] cursor-pointer transition-colors group">
                        <td class="py-2.5 px-4">
                            <div class="flex items-center gap-3">
                                <div class="w-5 h-5 flex items-center justify-center shrink-0">
                                    ${getClassSvg(t.type, isPrem)}
                                </div>
                                ${getTankIconSvg(t.tag)}
                                <div>
                                    <div class="font-medium text-white group-hover:text-neonGlow transition-colors leading-snug">${escapeHtml(t.name)}</div>
                                    ${nationLabel ? `<span class="text-[10px] font-semibold tracking-wider text-slate-500 uppercase">${nationLabel}</span>` : ''}
                                </div>
                            </div>
                        </td>
                        <td class="py-2.5 px-3 text-center font-mono font-bold ${t.tier === 11 ? 'text-neonGlow' : 'text-slate-300'}">${tierDisplay}</td>
                        <td class="py-2.5 px-3 text-center font-mono tabular-nums text-slate-300 font-medium">${formatNum(m['65'])}</td>
                        <td class="py-2.5 px-3 text-center font-mono tabular-nums text-amber-400 font-semibold">${formatNum(m['85'])}</td>
                        <td class="py-2.5 px-3 text-center font-mono tabular-nums">
                            <span class="inline-block px-2.5 py-0.5 rounded-md bg-neonViolet/15 border border-neonViolet/40 text-neonGlow font-bold neon-text-shadow">
                                ${formatNum(m['95'])}
                            </span>
                        </td>
                        <td class="py-2.5 px-3 text-center font-mono tabular-nums text-cyan-400 font-semibold">${formatNum(m['100'])}</td>
                        <td class="py-2.5 px-3 text-center" onclick="event.stopPropagation(); openTankModal(${t.id})">
                            <button class="px-2.5 py-1.5 rounded-lg bg-white/5 hover:bg-neonViolet text-slate-300 hover:text-white text-xs transition-colors inline-flex items-center gap-1.5">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                                <span>График</span>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            // Мобильные карточки (65% серебро, 85% золото, 95% главный неон, 100% циан)
            mobileContainer.innerHTML = filtered.map(t => {
                const m = t.marks || {};
                const tierDisplay = romanTiers[t.tier] || t.tier;
                const isPrem = Boolean(t.is_premium || t.is_special);
                const nationLabel = nationNames[t.nation] || '';

                return `
                    <div onclick="openTankModal(${t.id})" class="bg-slateCard border border-white/5 rounded-2xl p-3.5 active:scale-[0.99] transition-transform">
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <div class="flex items-center gap-2.5">
                                ${getClassSvg(t.type, isPrem)}
                                <div>
                                    <div class="font-bold text-white text-sm leading-tight">${escapeHtml(t.name)}</div>
                                    <div class="text-[10px] text-slate-400 mt-0.5">${tierDisplay} ур. ${nationLabel ? '• ' + nationLabel : ''}</div>
                                </div>
                            </div>
                            <button class="px-2.5 py-1 rounded-lg bg-white/5 text-neonGlow text-xs flex items-center gap-1">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                                График
                            </button>
                        </div>
                        <div class="grid grid-cols-4 gap-1.5 font-mono tabular-nums text-center">
                            <div class="bg-black/25 py-1.5 px-1 rounded-lg border border-white/5">
                                <span class="text-[9px] font-sans text-slate-400 block uppercase font-bold">65%</span>
                                <span class="text-xs font-bold text-slate-300">${formatNum(m['65'])}</span>
                            </div>
                            <div class="bg-black/25 py-1.5 px-1 rounded-lg border border-white/5">
                                <span class="text-[9px] font-sans text-amber-500 block uppercase font-bold">85%</span>
                                <span class="text-xs font-bold text-amber-400">${formatNum(m['85'])}</span>
                            </div>
                            <div class="bg-neonViolet/15 py-1.5 px-1 rounded-lg border border-neonViolet/40">
                                <span class="text-[9px] font-sans text-neonGlow block uppercase font-bold">95%</span>
                                <span class="text-xs font-bold text-neonGlow neon-text-shadow">${formatNum(m['95'])}</span>
                            </div>
                            <div class="bg-black/25 py-1.5 px-1 rounded-lg border border-white/5">
                                <span class="text-[9px] font-sans text-cyan-500 block uppercase font-bold">100%</span>
                                <span class="text-xs font-bold text-cyan-400">${formatNum(m['100'])}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function sortTable(field) {
            if (currentSort.field === field) {
                currentSort.asc = !currentSort.asc;
            } else {
                currentSort.field = field;
                currentSort.asc = field === 'name';
            }
            applyFiltersChange('push');
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            input.focus();
            applyFiltersChange('replace');
        }

        function resetAllFilters() {
            currentTiers = [];
            currentClass = 'all';
            currentType = 'all';
            currentNation = 'all';
            currentSort = { field: 'tier', asc: false };
            document.getElementById('searchInput').value = '';
            applyFiltersChange('push');
        }

        // Обработчики кнопок фильтров
        document.querySelectorAll('.tier-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tier = e.currentTarget.dataset.tier;
                if (tier === 'all') {
                    currentTiers = [];
                } else if (currentTiers.includes(tier)) {
                    currentTiers = currentTiers.filter(t => t !== tier);
                } else {
                    currentTiers = [...currentTiers, tier];
                }
                applyFiltersChange('push');
            });
        });

        document.querySelectorAll('.class-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentClass = e.currentTarget.dataset.class;
                applyFiltersChange('push');
            });
        });

        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentType = e.currentTarget.dataset.type;
                applyFiltersChange('push');
            });
        });

        // Кастомный dropdown нации
        document.getElementById('nationFilterBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = e.currentTarget.getAttribute('aria-expanded') === 'true';
            setNationMenuOpen(!isOpen);
        });

        document.getElementById('nationFilterBtn').addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                setNationMenuOpen(true);
                const first = document.querySelector('#nationFilterMenu [data-nation]');
                if (first) first.focus();
            }
        });

        document.getElementById('nationFilterMenu').addEventListener('click', (e) => {
            const option = e.target.closest('[data-nation]');
            if (!option) return;
            currentNation = option.dataset.nation;
            setNationMenuOpen(false);
            document.getElementById('nationFilterBtn').focus();
            applyFiltersChange('push');
        });

        document.getElementById('nationFilterMenu').addEventListener('keydown', (e) => {
            const options = [...document.querySelectorAll('#nationFilterMenu [data-nation]')];
            const index = options.indexOf(document.activeElement);

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                options[Math.min(index + 1, options.length - 1)]?.focus();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                options[Math.max(index - 1, 0)]?.focus();
            } else if (e.key === 'Home') {
                e.preventDefault();
                options[0]?.focus();
            } else if (e.key === 'End') {
                e.preventDefault();
                options[options.length - 1]?.focus();
            } else if (e.key === 'Escape') {
                setNationMenuOpen(false);
                document.getElementById('nationFilterBtn').focus();
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#nationDropdown')) setNationMenuOpen(false);
        });

        document.getElementById('searchInput').addEventListener('input', () => {
            renderTable();
            clearTimeout(searchUrlTimer);
            searchUrlTimer = setTimeout(() => {
                persistState();
                updateUrl('replace');
            }, 300);
        });

        // Модальное окно и история
        async function openTankModal(tankId) {
            activeTankId = tankId;
            const tank = allTanks.find(t => t.id === tankId);
            if (!tank) return;

            const romanTiers = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
            const classNames = {
                'heavyTank': 'Тяжелый танк',
                'mediumTank': 'Средний танк',
                'lightTank': 'Легкий танк',
                'AT-SPG': 'ПТ-САУ',
                'SPG': 'САУ'
            };

            const isPrem = Boolean(tank.is_premium || tank.is_special);
            const nationLabel = nationNames[tank.nation] || (tank.nation ? tank.nation.toUpperCase() : '');
            const roleLabel = roleLabels[tank.role] || '';

            document.getElementById('modalTankName').innerText = tank.name;
            document.getElementById('modalTankSub').innerText = `${romanTiers[tank.tier] || tank.tier} уровень • ${classNames[tank.type] || tank.type}${nationLabel ? ' • ' + nationLabel : ''}${roleLabel ? ' • ' + roleLabel : ''}`;
            document.getElementById('modalClassIcon').innerHTML = getClassSvg(tank.type, isPrem);

            const m = tank.marks || {};
            document.getElementById('modalM65').innerText = formatNum(m['65']);
            document.getElementById('modalM85').innerText = formatNum(m['85']);
            document.getElementById('modalM95').innerText = formatNum(m['95']);
            document.getElementById('modalM100').innerText = formatNum(m['100']);

            document.getElementById('tankModal').classList.remove('hidden');

            await loadTankHistory(tankId, m);
        }

        function closeModal() {
            document.getElementById('tankModal').classList.add('hidden');
            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }
        }

        async function loadTankHistory(tankId, currentMarks) {
            let history = [];
            try {
                const res = await fetch(`./data/history/${tankId}.json`, { cache: 'no-cache' });
                if (res.ok) {
                    history = await res.json();
                }
            } catch (e) {}

            if (!history || history.length === 0) {
                const today = new Date().toISOString().split('T')[0];
                history = [{ date: today, '95': currentMarks['95'], '100': currentMarks['100'] }];
            }

            activeTankHistory = history;

            // Бейдж изменения планки 95% относительно первой записи
            const trendBadge = document.getElementById('modalTrendBadge');
            if (history.length >= 2) {
                const last = history[history.length - 1]['95'] || 0;
                const prev = history[0]['95'] || 0;
                const diff = last - prev;
                if (diff > 0) {
                    trendBadge.innerText = `↑ +${diff}`;
                    trendBadge.className = 'text-[11px] font-mono px-2 py-0.5 rounded-md font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30';
                } else if (diff < 0) {
                    trendBadge.innerText = `↓ ${diff}`;
                    trendBadge.className = 'text-[11px] font-mono px-2 py-0.5 rounded-md font-semibold bg-rose-500/15 text-rose-400 border border-rose-500/30';
                } else {
                    trendBadge.className = 'hidden';
                }
            } else {
                trendBadge.className = 'hidden';
            }

            setChartTimeframe(currentTimeframe);
        }

        function setChartTimeframe(days) {
            currentTimeframe = days;

            // Подсветка активной кнопки периода
            document.querySelectorAll('.tf-btn').forEach(btn => {
                if (String(btn.dataset.days) === String(days)) {
                    btn.className = 'tf-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-neonViolet text-white transition-colors';
                } else {
                    btn.className = 'tf-btn px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-colors';
                }
            });

            let sliced = activeTankHistory;
            if (days !== 'all' && activeTankHistory.length > Number(days)) {
                sliced = activeTankHistory.slice(-Number(days));
            }

            const labels = sliced.map(h => h.date);
            const data95 = sliced.map(h => h['95']);
            const data100 = sliced.map(h => h['100']);

            const ctx = document.getElementById('historyChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const showPoints = sliced.length <= 1 ? 4 : 0;

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '95%',
                            data: data95,
                            borderColor: '#C084FC',
                            backgroundColor: 'rgba(192, 132, 252, 0.1)',
                            borderWidth: 2.5,
                            pointRadius: showPoints,
                            pointHoverRadius: 5,
                            pointBackgroundColor: '#C084FC',
                            tension: 0.3,
                            fill: true
                        },
                        {
                            label: '100%',
                            data: data100,
                            borderColor: '#22D3EE',
                            backgroundColor: 'rgba(34, 211, 238, 0.08)',
                            borderWidth: 2,
                            pointRadius: showPoints,
                            pointHoverRadius: 5,
                            pointBackgroundColor: '#22D3EE',
                            tension: 0.3,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            labels: { color: '#CBD5E1', font: { family: 'Inter', size: 11 } }
                        },
                        tooltip: {
                            backgroundColor: '#161522',
                            titleColor: '#F8FAFC',
                            bodyColor: '#E2E8F0',
                            borderColor: 'rgba(139, 92, 246, 0.4)',
                            borderWidth: 1,
                            padding: 10,
                            bodyFont: { family: 'JetBrains Mono', size: 12 }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#64748B', font: { size: 10 } },
                            grid: { color: 'rgba(255,255,255,0.04)' }
                        },
                        y: {
                            ticks: { color: '#64748B', font: { family: 'JetBrains Mono', size: 10 } },
                            grid: { color: 'rgba(255,255,255,0.04)' }
                        }
                    }
                }
            });
        }

        // Закрытие модального окна по клику на фон или клавише Esc
        document.getElementById('tankModal').addEventListener('click', (e) => {
            if (e.target.id === 'tankModal') closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                setNationMenuOpen(false);
                closeModal();
            }
        });

        loadIconsSprite();
        initUrlState();
        loadData();
    </script>
</body>
</html>
