<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B0B10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TANK MARKS • Мир Танков</title>
    
    <!-- Фавикон во вкладке браузера (Танковый прицел) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230B0B10' stroke='%238B5CF6' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23C084FC' stroke-width='1.5' stroke-dasharray='3 2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23C084FC'/%3E%3Cpath d='M16 2v6M16 24v6M2 16h6M24 16h6' stroke='%238B5CF6' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">

    <!-- Шрифты Inter и JetBrains Mono для идеального выравнивания цифр -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        obsidian: '#0B0B10',
                        slateCard: '#161522',
                        neonViolet: '#8B5CF6',
                        neonGlow: '#C084FC',
                    }
                }
            }
        }
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0B0B10; color: #F8FAFC; }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0B0B10; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #2D2B42; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #8B5CF6; }
        .neon-text-shadow { text-shadow: 0 0 12px rgba(192, 132, 252, 0.45); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-neonViolet selection:text-white antialiased">

    <!-- Шапка -->
    <header class="sticky top-0 z-40 backdrop-blur-md bg-obsidian/90 border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
            <div class="flex items-center justify-between w-full md:w-auto">
                <div class="flex items-center gap-3">
                    <!-- Логотип сайта -->
                    <div class="w-10 h-10 rounded-xl bg-neonViolet/15 border border-neonViolet/30 flex items-center justify-center shadow-lg shadow-neonViolet/20 shrink-0">
                        <svg class="w-6 h-6 text-neonGlow" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="9" stroke-width="1.8" class="text-neonViolet" />
                            <circle cx="12" cy="12" r="4.5" stroke-width="1.4" stroke-dasharray="2 2" />
                            <circle cx="12" cy="12" r="1.5" fill="currentColor" />
                            <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke-width="1.8" stroke-linecap="round" class="text-neonViolet" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="font-bold text-base tracking-wide text-white flex items-center gap-2">
                            TANK<span class="text-neonViolet">MARKS</span> 
                            <span class="text-[11px] px-2 py-0.5 rounded-full bg-neonViolet/20 text-neonGlow border border-neonViolet/30">Lesta RU</span>
                        </h1>
                        <p class="text-[11px] text-slate-400" id="lastUpdated">Загрузка данных...</p>
                    </div>
                </div>
            </div>

            <!-- Строка поиска с кнопкой очистки -->
            <div class="w-full md:w-80 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="searchInput" placeholder="Поиск по названию или сленгу..." 
                    class="w-full pl-9 pr-8 py-2 bg-slateCard border border-white/10 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-neonViolet focus:ring-1 focus:ring-neonViolet/50 transition-all">
                <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-white transition-colors">
                    ✕
                </button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-7xl mx-auto px-4 py-5 flex-grow w-full">
        
        <!-- Компактная панель фильтров -->
        <div class="bg-slateCard border border-white/5 rounded-2xl p-4 mb-5 shadow-xl space-y-3.5">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                <!-- Уровни техники -->
                <div>
                    <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1.5">Уровень техники</span>
                    <div class="flex flex-wrap gap-1.5" id="tierFilters">
                        <button data-tier="all" class="tier-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">Все</button>
                        <button data-tier="5" class="tier-btn px-3 py-1.5 rounded-lg text-xs font-medium font-mono transition-all">V</button>
                        <button data-tier="6" class="tier-btn px-3 py-1.5 rounded-lg text-xs font-medium font-mono transition-all">VI</button>
                        <button data-tier="7" class="tier-btn px-3 py-1.5 rounded-lg text-xs font-medium font-mono transition-all">VII</button>
                        <button data-tier="8" class="tier-btn px-3 py-1.5 rounded-lg text-xs font-medium font-mono transition-all">VIII</button>
                        <button data-tier="9" class="tier-btn px-3 py-1.5 rounded-lg text-xs font-medium font-mono transition-all">IX</button>
                        <button data-tier="10" class="tier-btn px-3 py-1.5 rounded-lg text-xs font-medium font-mono transition-all">X</button>
                        <button data-tier="11" class="tier-btn px-3 py-1.5 rounded-lg text-xs font-medium font-mono transition-all">XI</button>
                    </div>
                </div>

                <!-- Классы техники -->
                <div>
                    <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1.5">Класс техники</span>
                    <div class="flex flex-wrap gap-1.5" id="classFilters">
                        <button data-class="all" class="class-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">Все</button>
                        <button data-class="heavyTank" class="class-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">ТТ</button>
                        <button data-class="mediumTank" class="class-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">СТ</button>
                        <button data-class="lightTank" class="class-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">ЛТ</button>
                        <button data-class="AT-SPG" class="class-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">ПТ</button>
                        <button data-class="SPG" class="class-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">САУ</button>
                    </div>
                </div>

                <!-- Тип получения -->
                <div>
                    <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1.5">Тип получения</span>
                    <div class="flex flex-wrap gap-1.5" id="typeFilters">
                        <button data-type="all" class="type-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">Все</button>
                        <button data-type="tech" class="type-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">Прокачиваемые</button>
                        <button data-type="prem" class="type-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all">Премиум / Акционные</button>
                    </div>
                </div>
            </div>

            <!-- Индикатор количества и быстрый сброс -->
            <div class="pt-2.5 border-t border-white/5 flex items-center justify-between text-xs text-slate-400">
                <span id="resultsCounter">Загрузка списка...</span>
                <button id="resetFiltersBtn" onclick="resetAllFilters()" class="hidden text-neonGlow hover:text-white font-medium flex items-center gap-1 transition-colors">
                    <span>✕ Сбросить фильтры</span>
                </button>
            </div>
        </div>

        <!-- Десктопная таблица (скрыта на узких экранах < 640px) -->
        <div class="hidden sm:block bg-slateCard border border-white/5 rounded-2xl shadow-2xl overflow-clip">
            <table class="w-full text-left border-collapse">
                <thead class="sticky top-[65px] z-30 bg-[#12111C]/95 backdrop-blur-md border-b border-white/10 text-xs font-semibold text-slate-400 uppercase">
                    <tr>
                        <th class="py-3.5 px-4 cursor-pointer hover:text-white transition-colors select-none" onclick="sortTable('name')">
                            Танк <span id="sort-name" class="text-slate-600 ml-0.5">↕</span>
                        </th>
                        <th class="py-3.5 px-3 text-center cursor-pointer hover:text-white transition-colors select-none" onclick="sortTable('tier')">
                            Ур. <span id="sort-tier" class="text-slate-600 ml-0.5">↕</span>
                        </th>
                        <th class="py-3.5 px-3 text-center cursor-pointer hover:text-white transition-colors select-none" onclick="sortTable('m65')">
                            65% <span id="sort-m65" class="text-slate-600 ml-0.5">↕</span>
                        </th>
                        <th class="py-3.5 px-3 text-center cursor-pointer hover:text-white transition-colors select-none" onclick="sortTable('m85')">
                            85% <span id="sort-m85" class="text-slate-600 ml-0.5">↕</span>
                        </th>
                        <th class="py-3.5 px-3 text-center cursor-pointer hover:text-white transition-colors select-none text-neonGlow" onclick="sortTable('m95')">
                            95% <span id="sort-m95" class="text-slate-600 ml-0.5">↕</span>
                        </th>
                        <th class="py-3.5 px-3 text-center cursor-pointer hover:text-white transition-colors select-none text-cyan-400" onclick="sortTable('m100')">
                            100% <span id="sort-m100" class="text-slate-600 ml-0.5">↕</span>
                        </th>
                        <th class="py-3.5 px-3 text-center">График</th>
                    </tr>
                </thead>
                <tbody id="tankTableBody" class="divide-y divide-white/5 text-sm">
                    <!-- Скелетон при загрузке -->
                </tbody>
            </table>
        </div>

        <!-- Мобильные карточки (показываются только на смартфонах < 640px) -->
        <div id="mobileCardsContainer" class="sm:hidden space-y-2.5"></div>
    </main>

    <!-- Модальное окно / Bottom Sheet на смартфонах -->
    <div id="tankModal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/75 backdrop-blur-sm hidden sm:p-4 transition-opacity">
        <div class="bg-slateCard border-t sm:border border-white/10 rounded-t-3xl sm:rounded-2xl max-w-2xl w-full p-5 sm:p-6 shadow-2xl relative max-h-[92vh] overflow-y-auto">
            <!-- Полоска-хэндл для мобильной шторки -->
            <div class="w-12 h-1.5 bg-white/15 rounded-full mx-auto mb-4 sm:hidden"></div>

            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-base font-bold w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center transition-colors">✕</button>
            
            <div class="flex items-center gap-3.5 mb-5">
                <div id="modalClassIcon" class="w-11 h-11 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center shrink-0"></div>
                <div>
                    <div class="flex items-center gap-2">
                        <h2 id="modalTankName" class="text-lg font-bold text-white leading-tight">Название танка</h2>
                        <span id="modalTrendBadge" class="hidden text-[11px] font-mono px-2 py-0.5 rounded-md font-semibold"></span>
                    </div>
                    <p id="modalTankSub" class="text-xs text-slate-400 mt-0.5">Уровень • Класс • Нация</p>
                </div>
            </div>

            <!-- Текущие планки (65% серебро, 85% золото, 95% главный неон, 100% алмазный циан) -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mb-5 font-mono tabular-nums">
                <div class="bg-black/25 p-3 rounded-xl border border-white/5 text-center">
                    <span class="text-[10px] font-sans text-slate-400 block uppercase font-bold tracking-wider">65%</span>
                    <span id="modalM65" class="text-base font-bold text-slate-300 mt-0.5 block">-</span>
                </div>
                <div class="bg-black/25 p-3 rounded-xl border border-white/5 text-center">
                    <span class="text-[10px] font-sans text-amber-500 block uppercase font-bold tracking-wider">85%</span>
                    <span id="modalM85" class="text-base font-bold text-amber-400 mt-0.5 block">-</span>
                </div>
                <div class="bg-neonViolet/15 p-3 rounded-xl border border-neonViolet/40 text-center">
                    <span class="text-[10px] font-sans text-neonGlow block uppercase font-bold tracking-wider">95%</span>
                    <span id="modalM95" class="text-base font-bold text-neonGlow neon-text-shadow mt-0.5 block">-</span>
                </div>
                <div class="bg-black/25 p-3 rounded-xl border border-white/5 text-center">
                    <span class="text-[10px] font-sans text-cyan-500 block uppercase font-bold tracking-wider">100%</span>
                    <span id="modalM100" class="text-base font-bold text-cyan-400 mt-0.5 block">-</span>
                </div>
            </div>

            <!-- Панель управления периодом графика -->
            <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Динамика отметок</span>
                <div class="flex gap-1 bg-black/30 p-1 rounded-xl border border-white/5" id="timeframeButtons">
                    <button data-days="7" onclick="setChartTimeframe(7)" class="tf-btn px-2.5 py-1 rounded-lg text-xs font-medium transition-colors">7д</button>
                    <button data-days="30" onclick="setChartTimeframe(30)" class="tf-btn px-2.5 py-1 rounded-lg text-xs font-medium transition-colors">30д</button>
                    <button data-days="90" onclick="setChartTimeframe(90)" class="tf-btn px-2.5 py-1 rounded-lg text-xs font-medium transition-colors">90д</button>
                    <button data-days="all" onclick="setChartTimeframe('all')" class="tf-btn px-2.5 py-1 rounded-lg text-xs font-medium transition-colors">Все</button>
                </div>
            </div>

            <!-- График динамики -->
            <div class="relative h-64 sm:h-72 w-full pt-1">
                <canvas id="historyChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Футер -->
    <footer class="border-t border-white/10 py-5 mt-10 bg-obsidian">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
            <p>TANK MARKS • Мир Танков (Lesta RU)</p>
        </div>
    </footer>

    <!-- Скрипты интерфейса -->
    <script>
        let allTanks = [];
        let currentTier = localStorage.getItem('tm_tier') || 'all';
        let currentClass = localStorage.getItem('tm_class') || 'all';
        let currentType = localStorage.getItem('tm_type') || 'all';
        let currentSort = JSON.parse(localStorage.getItem('tm_sort') || '{"field":"tier","asc":false}');
        
        let activeTankId = null;
        let activeTankHistory = [];
        let currentTimeframe = 'all';
        let chartInstance = null;

        const nationNames = {
            'ussr': 'СССР',
            'germany': 'ГЕРМАНИЯ',
            'usa': 'США',
            'china': 'КИТАЙ',
            'france': 'ФРАНЦИЯ',
            'uk': 'БРИТАНИЯ',
            'japan': 'ЯПОНИЯ',
            'czech': 'ЧЕХИЯ',
            'sweden': 'ШВЕЦИЯ',
            'poland': 'ПОЛЬША',
            'italy': 'ИТАЛИЯ',
            'intunion': 'СОЮЗ'
        };

        const slangMap = {
            'конь': 'super conqueror',
            'бабаха': 'fv4005',
            'огурец': '279',
            'дед': 'ис-7',
            'гриль': 'grille',
            'бурасик': 'bourrasque',
            'ебр': 'ebr',
            'лео': 'leopard',
            'чиф': 'chieftain',
            'прога': 'progetto',
            'рога': 'progetto',
            'вазик': 'wz-',
            'объект': 'об.',
            'мантикора': 'manticore',
            'яга': 'jagdpanzer'
        };

        // Векторные иконки классов из клиента игры (белый для прокачиваемых, золотой для премов)
        function getClassSvg(type, isPremium = false) {
            const color = isPremium ? '#F59E0B' : '#FFFFFF';
            switch(type) {
                case 'heavyTank':
                    return `<svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="${color}">
                        <g transform="rotate(-45 12 12)">
                            <rect x="3.5" y="3.5" width="4.5" height="17"/>
                            <rect x="9.75" y="3.5" width="4.5" height="17"/>
                            <rect x="16" y="3.5" width="4.5" height="17"/>
                        </g>
                    </svg>`;
                case 'mediumTank':
                    return `<svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="${color}">
                        <g transform="rotate(-45 12 12)">
                            <rect x="3.5" y="3.5" width="7" height="17"/>
                            <rect x="13.5" y="3.5" width="7" height="17"/>
                        </g>
                    </svg>`;
                case 'lightTank':
                    return `<svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="${color}">
                        <rect x="4.5" y="4.5" width="15" height="15" transform="rotate(45 12 12)"/>
                    </svg>`;
                case 'AT-SPG':
                    return `<svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="${color}">
                        <polygon points="3,5 21,5 12,20"/>
                    </svg>`;
                case 'SPG':
                    return `<svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="${color}">
                        <rect x="4.5" y="4.5" width="15" height="15"/>
                    </svg>`;
                default:
                    return `<svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="${color}"><circle cx="12" cy="12" r="7"/></svg>`;
            }
        }

        // Форматирование чисел с пробелом тысячи (4 850)
        function formatNum(num) {
            if (!num) return '-';
            return Number(num).toLocaleString('ru-RU');
        }

        // Отрисовка Skeleton-загрузки
        function showSkeleton() {
            const tbody = document.getElementById('tankTableBody');
            const skeletonRows = Array(8).fill(0).map(() => `
                <tr class="animate-pulse">
                    <td class="py-3.5 px-4"><div class="h-5 bg-white/5 rounded-lg w-48"></div></td>
                    <td class="py-3.5 px-3"><div class="h-5 bg-white/5 rounded-lg w-8 mx-auto"></div></td>
                    <td class="py-3.5 px-3"><div class="h-5 bg-white/5 rounded-lg w-16 mx-auto"></div></td>
                    <td class="py-3.5 px-3"><div class="h-5 bg-white/5 rounded-lg w-16 mx-auto"></div></td>
                    <td class="py-3.5 px-3"><div class="h-5 bg-white/5 rounded-lg w-16 mx-auto"></div></td>
                    <td class="py-3.5 px-3"><div class="h-5 bg-white/5 rounded-lg w-16 mx-auto"></div></td>
                    <td class="py-3.5 px-3"><div class="h-6 bg-white/5 rounded-lg w-20 mx-auto"></div></td>
                </tr>
            `).join('');
            tbody.innerHTML = skeletonRows;
        }

        // Подсветка активных кнопок фильтров
        function syncFilterButtonsUI() {
            const activeClasses = ['bg-neonViolet', 'text-white', 'shadow-sm', 'shadow-neonViolet/40', 'border', 'border-neonViolet/50'];
            const inactiveClasses = ['bg-white/5', 'text-slate-300', 'hover:bg-white/10', 'border', 'border-transparent'];

            document.querySelectorAll('.tier-btn').forEach(btn => {
                btn.classList.remove(...activeClasses, ...inactiveClasses);
                btn.classList.add(...(btn.dataset.tier === String(currentTier) ? activeClasses : inactiveClasses));
            });

            document.querySelectorAll('.class-btn').forEach(btn => {
                btn.classList.remove(...activeClasses, ...inactiveClasses);
                btn.classList.add(...(btn.dataset.class === currentClass ? activeClasses : inactiveClasses));
            });

            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.remove(...activeClasses, ...inactiveClasses);
                btn.classList.add(...(btn.dataset.type === currentType ? activeClasses : inactiveClasses));
            });

            // Стрелки сортировки в шапке таблицы
            ['name', 'tier', 'm65', 'm85', 'm95', 'm100'].forEach(field => {
                const el = document.getElementById(`sort-${field}`);
                if (!el) return;
                if (currentSort.field === field) {
                    el.innerText = currentSort.asc ? '↑' : '↓';
                    el.className = 'text-white ml-0.5 font-bold';
                } else {
                    el.innerText = '↕';
                    el.className = 'text-slate-600 ml-0.5';
                }
            });
        }

        // Загрузка данных
        async function loadData() {
            showSkeleton();
            syncFilterButtonsUI();
            try {
                const response = await fetch('./data/latest.json?v=' + Date.now(), { cache: 'no-store' });
                if (!response.ok) throw new Error('Файл latest.json не найден');
                const data = await response.json();
                
                allTanks = data.vehicles || [];
                
                if (data.updated_at) {
                    const date = new Date(data.updated_at);
                    document.getElementById('lastUpdated').innerText = `Обновлено: ${date.toLocaleDateString('ru-RU')} в ${date.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'})}`;
                }

                renderTable();
            } catch (err) {
                console.error(err);
                document.getElementById('tankTableBody').innerHTML = `<tr><td colspan="7" class="py-8 text-center text-red-400">Не удалось загрузить базу отметок.</td></tr>`;
            }
        }

        // Отрисовка таблицы и мобильных карточек
        function renderTable() {
            const tbody = document.getElementById('tankTableBody');
            const mobileContainer = document.getElementById('mobileCardsContainer');
            const searchInput = document.getElementById('searchInput');
            const searchVal = searchInput.value.toLowerCase().trim();
            
            // Показываем/скрываем крестик очистки поиска
            document.getElementById('clearSearchBtn').classList.toggle('hidden', !searchVal);

            // Показываем/скрываем кнопку сброса всех фильтров
            const isDefaultFilters = currentTier === 'all' && currentClass === 'all' && currentType === 'all' && !searchVal;
            document.getElementById('resetFiltersBtn').classList.toggle('hidden', isDefaultFilters);

            let query = searchVal;
            if (slangMap[searchVal]) {
                query = slangMap[searchVal];
            }

            const filtered = allTanks.filter(t => {
                if (currentTier !== 'all' && String(t.tier) !== String(currentTier)) return false;
                if (currentClass !== 'all' && t.type !== currentClass) return false;
                
                const isPremOrSpecial = Boolean(t.is_premium || t.is_special);
                if (currentType === 'tech' && isPremOrSpecial) return false;
                if (currentType === 'prem' && !isPremOrSpecial) return false;

                if (query) {
                    const nameRu = (t.name || '').toLowerCase();
                    const shortName = (t.short_name || '').toLowerCase();
                    if (!nameRu.includes(query) && !shortName.includes(query)) return false;
                }
                return true;
            });

            // Обновляем счетчик найденных танков
            document.getElementById('resultsCounter').innerText = `Найдено техники: ${filtered.length} из ${allTanks.length}`;

            // Сортировка
            filtered.sort((a, b) => {
                let valA, valB;
                if (currentSort.field === 'name') {
                    valA = a.name || '';
                    valB = b.name || '';
                    return currentSort.asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else if (currentSort.field === 'tier') {
                    valA = a.tier || 0;
                    valB = b.tier || 0;
                } else {
                    valA = (a.marks && a.marks[currentSort.field.replace('m', '')]) || 0;
                    valB = (b.marks && b.marks[currentSort.field.replace('m', '')]) || 0;
                }
                return currentSort.asc ? valA - valB : valB - valA;
            });

            if (filtered.length === 0) {
                const emptyHtml = `
                    <div class="py-10 text-center text-slate-400">
                        <p class="mb-2">Техника по заданным фильтрам не найдена</p>
                        <button onclick="resetAllFilters()" class="px-3 py-1.5 rounded-lg bg-neonViolet/20 text-neonGlow hover:bg-neonViolet hover:text-white text-xs font-medium transition-colors">Сбросить параметры</button>
                    </div>`;
                tbody.innerHTML = `<tr><td colspan="7">${emptyHtml}</td></tr>`;
                mobileContainer.innerHTML = emptyHtml;
                return;
            }

            const romanTiers = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];

            // Десктопные строки (65% серебро, 85% золото, 95% главный неон, 100% циан)
            tbody.innerHTML = filtered.map(t => {
                const m = t.marks || {};
                const tierDisplay = romanTiers[t.tier] || t.tier;
                const isPrem = Boolean(t.is_premium || t.is_special);
                const nationLabel = nationNames[t.nation] || (t.nation ? t.nation.toUpperCase() : '');
                const iconUrl = t.tag ? `https://cdn.poliroid.me/icons/tanks_svg/ru/${t.tag}.svg` : '';

                return `
                    <tr onclick="openTankModal(${t.id})" class="hover:bg-white/[0.04] cursor-pointer transition-colors group">
                        <td class="py-2.5 px-4">
                            <div class="flex items-center gap-3">
                                <div class="w-5 h-5 flex items-center justify-center shrink-0">
                                    ${getClassSvg(t.type, isPrem)}
                                </div>
                                ${iconUrl ? `<img src="${iconUrl}" alt="" loading="lazy" onerror="this.style.display='none'" class="w-14 h-8 object-contain opacity-85 group-hover:opacity-100 transition-opacity shrink-0 pointer-events-none">` : ''}
                                <div>
                                    <div class="font-medium text-white group-hover:text-neonGlow transition-colors leading-snug">${t.name}</div>
                                    ${nationLabel ? `<span class="text-[10px] font-semibold tracking-wider text-slate-500 uppercase">${nationLabel}</span>` : ''}
                                </div>
                            </div>
                        </td>
                        <td class="py-2.5 px-3 text-center font-mono font-bold ${t.tier === 11 ? 'text-neonGlow' : 'text-slate-300'}">${tierDisplay}</td>
                        <td class="py-2.5 px-3 text-center font-mono tabular-nums text-slate-300 font-medium">${formatNum(m['65'])}</td>
                        <td class="py-2.5 px-3 text-center font-mono tabular-nums text-amber-400 font-semibold">${formatNum(m['85'])}</td>
                        <td class="py-2.5 px-3 text-center font-mono tabular-nums">
                            <span class="inline-block px-2.5 py-0.5 rounded-md bg-neonViolet/15 border border-neonViolet/40 text-neonGlow font-bold neon-text-shadow">
                                ${formatNum(m['95'])}
                            </span>
                        </td>
                        <td class="py-2.5 px-3 text-center font-mono tabular-nums text-cyan-400 font-semibold">${formatNum(m['100'])}</td>
                        <td class="py-2.5 px-3 text-center" onclick="event.stopPropagation(); openTankModal(${t.id})">
                            <button class="px-2.5 py-1.5 rounded-lg bg-white/5 hover:bg-neonViolet text-slate-300 hover:text-white text-xs transition-colors inline-flex items-center gap-1.5">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                                <span>График</span>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            // Мобильные карточки (65% серебро, 85% золото, 95% главный неон, 100% циан)
            mobileContainer.innerHTML = filtered.map(t => {
                const m = t.marks || {};
                const tierDisplay = romanTiers[t.tier] || t.tier;
                const isPrem = Boolean(t.is_premium || t.is_special);
                const nationLabel = nationNames[t.nation] || '';

                return `
                    <div onclick="openTankModal(${t.id})" class="bg-slateCard border border-white/5 rounded-2xl p-3.5 active:scale-[0.99] transition-transform">
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <div class="flex items-center gap-2.5">
                                ${getClassSvg(t.type, isPrem)}
                                <div>
                                    <div class="font-bold text-white text-sm leading-tight">${t.name}</div>
                                    <div class="text-[10px] text-slate-400 mt-0.5">${tierDisplay} ур. ${nationLabel ? '• ' + nationLabel : ''}</div>
                                </div>
                            </div>
                            <button class="px-2.5 py-1 rounded-lg bg-white/5 text-neonGlow text-xs flex items-center gap-1">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                                График
                            </button>
                        </div>
                        <div class="grid grid-cols-4 gap-1.5 font-mono tabular-nums text-center">
                            <div class="bg-black/25 py-1.5 px-1 rounded-lg border border-white/5">
                                <span class="text-[9px] font-sans text-slate-400 block uppercase font-bold">65%</span>
                                <span class="text-xs font-bold text-slate-300">${formatNum(m['65'])}</span>
                            </div>
                            <div class="bg-black/25 py-1.5 px-1 rounded-lg border border-white/5">
                                <span class="text-[9px] font-sans text-amber-500 block uppercase font-bold">85%</span>
                                <span class="text-xs font-bold text-amber-400">${formatNum(m['85'])}</span>
                            </div>
                            <div class="bg-neonViolet/15 py-1.5 px-1 rounded-lg border border-neonViolet/40">
                                <span class="text-[9px] font-sans text-neonGlow block uppercase font-bold">95%</span>
                                <span class="text-xs font-bold text-neonGlow neon-text-shadow">${formatNum(m['95'])}</span>
                            </div>
                            <div class="bg-black/25 py-1.5 px-1 rounded-lg border border-white/5">
                                <span class="text-[9px] font-sans text-cyan-500 block uppercase font-bold">100%</span>
                                <span class="text-xs font-bold text-cyan-400">${formatNum(m['100'])}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function sortTable(field) {
            if (currentSort.field === field) {
                currentSort.asc = !currentSort.asc;
            } else {
                currentSort.field = field;
                currentSort.asc = field === 'name';
            }
            localStorage.setItem('tm_sort', JSON.stringify(currentSort));
            syncFilterButtonsUI();
            renderTable();
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            input.focus();
            renderTable();
        }

        function resetAllFilters() {
            currentTier = 'all';
            currentClass = 'all';
            currentType = 'all';
            localStorage.setItem('tm_tier', 'all');
            localStorage.setItem('tm_class', 'all');
            localStorage.setItem('tm_type', 'all');
            document.getElementById('searchInput').value = '';
            syncFilterButtonsUI();
            renderTable();
        }

        // Обработчики кнопок фильтров
        document.querySelectorAll('.tier-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentTier = e.currentTarget.dataset.tier;
                localStorage.setItem('tm_tier', currentTier);
                syncFilterButtonsUI();
                renderTable();
            });
        });

        document.querySelectorAll('.class-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentClass = e.currentTarget.dataset.class;
                localStorage.setItem('tm_class', currentClass);
                syncFilterButtonsUI();
                renderTable();
            });
        });

        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentType = e.currentTarget.dataset.type;
                localStorage.setItem('tm_type', currentType);
                syncFilterButtonsUI();
                renderTable();
            });
        });

        document.getElementById('searchInput').addEventListener('input', () => {
            renderTable();
        });

        // Модальное окно и история
        async function openTankModal(tankId) {
            activeTankId = tankId;
            const tank = allTanks.find(t => t.id === tankId);
            if (!tank) return;

            const romanTiers = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
            const classNames = {
                'heavyTank': 'Тяжелый танк',
                'mediumTank': 'Средний танк',
                'lightTank': 'Легкий танк',
                'AT-SPG': 'ПТ-САУ',
                'SPG': 'САУ'
            };

            const isPrem = Boolean(tank.is_premium || tank.is_special);
            const nationLabel = nationNames[tank.nation] || (tank.nation ? tank.nation.toUpperCase() : '');

            document.getElementById('modalTankName').innerText = tank.name;
            document.getElementById('modalTankSub').innerText = `${romanTiers[tank.tier] || tank.tier} уровень • ${classNames[tank.type] || tank.type}${nationLabel ? ' • ' + nationLabel : ''}`;
            document.getElementById('modalClassIcon').innerHTML = getClassSvg(tank.type, isPrem);

            const m = tank.marks || {};
            document.getElementById('modalM65').innerText = formatNum(m['65']);
            document.getElementById('modalM85').innerText = formatNum(m['85']);
            document.getElementById('modalM95').innerText = formatNum(m['95']);
            document.getElementById('modalM100').innerText = formatNum(m['100']);

            document.getElementById('tankModal').classList.remove('hidden');

            await loadTankHistory(tankId, m);
        }

        function closeModal() {
            document.getElementById('tankModal').classList.add('hidden');
            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }
        }

        async function loadTankHistory(tankId, currentMarks) {
            let history = [];
            try {
                const res = await fetch(`./data/history/${tankId}.json?v=` + Date.now(), { cache: 'no-store' });
                if (res.ok) {
                    history = await res.json();
                }
            } catch (e) {}

            if (!history || history.length === 0) {
                const today = new Date().toISOString().split('T')[0];
                history = [{ date: today, '95': currentMarks['95'], '100': currentMarks['100'] }];
            }

            activeTankHistory = history;

            // Бейдж изменения планки 95% относительно первой записи
            const trendBadge = document.getElementById('modalTrendBadge');
            if (history.length >= 2) {
                const last = history[history.length - 1]['95'] || 0;
                const prev = history[0]['95'] || 0;
                const diff = last - prev;
                if (diff > 0) {
                    trendBadge.innerText = `↑ +${diff}`;
                    trendBadge.className = 'text-[11px] font-mono px-2 py-0.5 rounded-md font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30';
                } else if (diff < 0) {
                    trendBadge.innerText = `↓ ${diff}`;
                    trendBadge.className = 'text-[11px] font-mono px-2 py-0.5 rounded-md font-semibold bg-rose-500/15 text-rose-400 border border-rose-500/30';
                } else {
                    trendBadge.className = 'hidden';
                }
            } else {
                trendBadge.className = 'hidden';
            }

            setChartTimeframe(currentTimeframe);
        }

        function setChartTimeframe(days) {
            currentTimeframe = days;

            // Подсветка активной кнопки периода
            document.querySelectorAll('.tf-btn').forEach(btn => {
                if (String(btn.dataset.days) === String(days)) {
                    btn.className = 'tf-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-neonViolet text-white transition-colors';
                } else {
                    btn.className = 'tf-btn px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-colors';
                }
            });

            let sliced = activeTankHistory;
            if (days !== 'all' && activeTankHistory.length > Number(days)) {
                sliced = activeTankHistory.slice(-Number(days));
            }

            const labels = sliced.map(h => h.date);
            const data95 = sliced.map(h => h['95']);
            const data100 = sliced.map(h => h['100']);

            const ctx = document.getElementById('historyChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const showPoints = sliced.length <= 1 ? 4 : 0;

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '95%',
                            data: data95,
                            borderColor: '#C084FC',
                            backgroundColor: 'rgba(192, 132, 252, 0.1)',
                            borderWidth: 2.5,
                            pointRadius: showPoints,
                            pointHoverRadius: 5,
                            pointBackgroundColor: '#C084FC',
                            tension: 0.3,
                            fill: true
                        },
                        {
                            label: '100%',
                            data: data100,
                            borderColor: '#22D3EE',
                            backgroundColor: 'rgba(34, 211, 238, 0.08)',
                            borderWidth: 2,
                            pointRadius: showPoints,
                            pointHoverRadius: 5,
                            pointBackgroundColor: '#22D3EE',
                            tension: 0.3,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            labels: { color: '#CBD5E1', font: { family: 'Inter', size: 11 } }
                        },
                        tooltip: {
                            backgroundColor: '#161522',
                            titleColor: '#F8FAFC',
                            bodyColor: '#E2E8F0',
                            borderColor: 'rgba(139, 92, 246, 0.4)',
                            borderWidth: 1,
                            padding: 10,
                            bodyFont: { family: 'JetBrains Mono', size: 12 }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#64748B', font: { size: 10 } },
                            grid: { color: 'rgba(255,255,255,0.04)' }
                        },
                        y: {
                            ticks: { color: '#64748B', font: { family: 'JetBrains Mono', size: 10 } },
                            grid: { color: 'rgba(255,255,255,0.04)' }
                        }
                    }
                }
            });
        }

        // Закрытие модального окна по клику на фон или клавише Esc
        document.getElementById('tankModal').addEventListener('click', (e) => {
            if (e.target.id === 'tankModal') closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        loadData();
    </script>
</body>
</html>
